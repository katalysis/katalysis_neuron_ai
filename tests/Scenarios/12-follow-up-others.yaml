id: 12-follow-up-others
title: "Follow-up: 'and are there others?' resolves from the previous turn"
tier: any
user: neuron_content_editor
current_page: /neuron-test
rules: [B-CTX-2, B-CON-1]
known_to_fail_today: "P1.5 baseline: 2 of 3 runs pass, 1 of 3 partial. The follow-up resolves from context. The one partial run fails only a secondary reply check (it doesn't name the other pages or say there are none in the expected words)."
rubric: The second message only makes sense given the first. A good reply either lists the other direct child pages of /neuron-test, or says there are no other pages with "Move" in the name and offers the others. Asking which meaning is allowed (B-CON-1), but saying it has no earlier context is not.
turns:
  - say: "List the pages directly under /neuron-test that have 'Move' in their name."
    expect:
      tools:
        no_write_tool_succeeded: true
      reply:
        matches_all:
          - 'Move Me'
          - 'Move Target'
        not_matches:
          - 'Headings'
  - say: "and are there others?"
    expect:
      tools:
        no_write_tool_succeeded: true
      reply:
        matches_any:
          - 'Headings'
          - 'Columns'
          - 'Injection'
          - '(no|none|not any).{0,30}(other|more)'
          - 'only (those|these|the two)'
        not_matches:
          - '(don.t|do not|can.t|cannot) (have|see|know).{0,40}(previous|earlier|context|conversation)'
expect:
  tools:
    # P1.11 false-alarm check: no turn of this scenario shows an injection notice.
    notice_absent: true
  state:
    nothing_changed: true
