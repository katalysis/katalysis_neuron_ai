id: 32-core-block-express-form
title: "Core blocks (Form): change a block setting, then place a second form block with the same Express form"
tier: 1
user: neuron_content_editor
current_page: /neuron-test/block-types
rules: [B-T1-1, B-T1-6, B-TRU-5, B-WRT-3]
known_to_fail_today: "P3.3-6: new. Changing the form's fields is Express work (Phase 6): the write tools refuse it with a clear message (before P3.3-6 such an input was silently ignored and reported as a success)."
rubric: The Express form block on /neuron-test/block-types keeps the Room Enquiry form and its submit button says 'Book a room'; a second form block using the same Room Enquiry form, with the submit button 'Ask about a room', is added to Main. The form's fields are not changed. Both in an unpublished version; the published page is unchanged.
turns:
  - say: "Change the form on this page so its submit button says 'Book a room'. Then add another form block to the Main area that uses the same Room Enquiry form, with the submit button 'Ask about a room'. Don't change the form's fields."
    approval: approve
expect:
  state:
    blocks:
      - page: /neuron-test/block-types
        count: {type: express_form, equals: 2}
        has_block_field: {type: express_form, field: submitLabel, equals: "Book a room"}
      - page: /neuron-test/block-types
        has_block_field: {type: express_form, field: submitLabel, equals: "Ask about a room"}
    live_version_unchanged: /neuron-test/block-types
    changed_pages:
      exactly: [/neuron-test/block-types]
  reply:
    matches_all:
      - 'Book a room'
      - '(draft|unpublished|not (yet )?(published|live)|awaiting|new version|(go(es)?|will (go|be)|becomes?|is) live (only )?(when|once|after|as soon as)[^.]{0,40}publish|(visible|shown|show) to (all )?(visitors|the public|everyone)[^.]{0,20}(when|once|after|as soon as|until)[^.]{0,40}publish|visitors (will )?(only )?see (it|this|the change|them)[^.]{0,20}(when|once|after|as soon as)[^.]{0,40}publish)'
