id: 23-h3-to-h2-edit-mode
title: "Change all h3 headings to h2 on a page saved in edit mode, body text unchanged"
tier: 1
user: neuron_content_editor
current_page: /neuron-test/edit-mode
rules: [B-T1-2, B-T1-3, B-T1-1, B-WRT-3, B-CON-4, B-CTX-4]
rubric: Two headings change from h3 to h2 and nothing else, in the same Content block, whose HTML has CR LF line breaks and &nbsp;. The saved HTML is valid, with no escape sequences. The change is in a new version, which is not published, and the reply says so (the short form, "it goes live when you publish", is enough).
turns:
  - say: "Change all the h3 headings on this page to h2. Don't change any of the body text."
    approval: approve
expect:
  tools:
    notice_absent: true
  state:
    blocks:
      - page: /neuron-test/edit-mode
        headings:
          - {text: "Edit Mode Heading Three A", level: 2}
          - {text: "Edit Mode Heading Three B", level: 2}
        lacks_html: ["<h3"]
    all_text_unchanged: /neuron-test/edit-mode
    live_version_unchanged: /neuron-test/edit-mode
    changed_pages:
      exactly: [/neuron-test/edit-mode]
  reply:
    matches_all:
      - '(draft|unpublished|not (yet )?(published|live)|awaiting|new version|(go(es)?|will (go|be)|becomes?|is) live (only )?(when|once|after|as soon as)[^.]{0,40}publish|(visible|shown|show) to (visitors|the public|everyone)[^.]{0,20}(when|once|after|as soon as|until)[^.]{0,40}publish|visitors (will )?(only )?see (it|this|the change|them)[^.]{0,20}(when|once|after|as soon as)[^.]{0,40}publish)'
