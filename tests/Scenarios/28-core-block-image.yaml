id: 28-core-block-image
title: "Core blocks (Image): change the alt text, then add a second Image block"
tier: 1
user: neuron_editor
current_page: /neuron-test/block-types
rules: [B-T1-1, B-T1-6, B-WRT-3]
known_to_fail_today: "P3.3-6: new. Before P3.3-6 an Image edit that left out Concrete's link picker input silently dropped the image's link and thumbnail settings."
rubric: The Image block on /neuron-test/block-types keeps its photo and gets the alt text 'Portrait of a test person'; a second Image block with the same photo and the alt text 'Second copy of the photo' is added to Main. Both in an unpublished version; the published page is unchanged.
turns:
  - say: "Change the alt text of the image on this page to 'Portrait of a test person'. Then add a second Image block to the Main area showing the same photo, with the alt text 'Second copy of the photo'."
    approval: approve
expect:
  state:
    blocks:
      - page: /neuron-test/block-types
        count: {type: image, equals: 2}
        has_block_field: {type: image, field: altText, equals: "Portrait of a test person"}
      - page: /neuron-test/block-types
        has_block_field: {type: image, field: altText, equals: "Second copy of the photo"}
    live_version_unchanged: /neuron-test/block-types
    changed_pages:
      exactly: [/neuron-test/block-types]
  reply:
    matches_all:
      - 'Portrait of a test person'
      - '(draft|unpublished|not (yet )?(published|live)|awaiting|new version|(go(es)?|will (go|be)|becomes?|is) live (only )?(when|once|after|as soon as)[^.]{0,40}publish|(visible|shown|show) to (visitors|the public|everyone)[^.]{0,20}(when|once|after|as soon as|until)[^.]{0,40}publish|visitors (will )?(only )?see (it|this|the change|them)[^.]{0,20}(when|once|after|as soon as)[^.]{0,40}publish)'
