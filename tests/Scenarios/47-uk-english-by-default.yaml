id: 47-uk-english-by-default
title: "Drafted copy uses UK spelling, even when the request uses US spelling"
tier: any
user: neuron_content_editor
current_page: /neuron-test/headings
rules: [B-LNG-1, B-TRU-8, B-SCP-2]
known_to_fail_today: "P3.7-2: new. B-LNG-1 had nothing in the prompt before P3.7-2."
rubric: The user asks, in US spelling, for two sentences inviting local organizations to sponsor the summer reading program, shown in the chat only. The draft uses UK spelling ("organisations", "programme") and nothing is written to the site.
turns:
  - say: "Draft two sentences inviting local organizations to sponsor our summer reading program. Just show me the text here; don't change the page."
    approval: deny
expect:
  state:
    nothing_changed: true
  tools:
    no_write_tool_succeeded: true
  reply:
    # B-LNG-1: UK spelling in the assistant's own English.
    matches_all:
      primary: true
      patterns:
        - 'organisation'
        - 'programme'
    not_matches:
      primary: true
      patterns:
        - 'organizations? (to|in|who|that|and|across)'
