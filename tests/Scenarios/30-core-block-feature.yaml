id: 30-core-block-feature
title: "Core blocks (Feature): change the heading, keep the paragraph, then add a second Feature"
tier: 1
user: neuron_content_editor
current_page: /neuron-test/block-types
rules: [B-T1-1, B-T1-2, B-T1-6, B-WRT-3]
known_to_fail_today: "P3.3-6: new. Before P3.3-6 every Feature save through the write tools failed with 'Please select a value for Link' (the block's save() needs Concrete's link picker input)."
rubric: The Feature block on /neuron-test/block-types gets the heading 'Reading Room' and keeps its paragraph; a second Feature block with the heading 'Study Space' and the text 'Quiet desks on the first floor.' is added to Main. Both in an unpublished version; the published page is unchanged.
turns:
  - say: "Change the heading of the Feature block on this page to 'Reading Room' and keep its paragraph as it is. Then add a new Feature block to the Main area with the heading 'Study Space' and the text 'Quiet desks on the first floor.'"
    approval: approve
expect:
  state:
    blocks:
      - page: /neuron-test/block-types
        count: {type: feature, equals: 2}
        has_block_field: {type: feature, field: title, equals: "Reading Room"}
        has_block: {type: feature, containing: ["Reading Room", "Feature paragraph about the reading room."]}
      - page: /neuron-test/block-types
        has_block: {type: feature, containing: ["Study Space", "Quiet desks on the first floor."]}
    live_version_unchanged: /neuron-test/block-types
    changed_pages:
      exactly: [/neuron-test/block-types]
  reply:
    matches_all:
      - 'Reading Room'
      - '(draft|unpublished|not (yet )?(published|live)|awaiting|new version|(go(es)?|will (go|be)|becomes?|is) live (only )?(when|once|after|as soon as)[^.]{0,40}publish|(visible|shown|show) to (all )?(visitors|the public|everyone)[^.]{0,20}(when|once|after|as soon as|until)[^.]{0,40}publish|visitors (will )?(only )?see (it|this|the change|them)[^.]{0,20}(when|once|after|as soon as)[^.]{0,40}publish)'
