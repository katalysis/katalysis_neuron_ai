id: 31-core-block-accordion
title: "Core blocks (Accordion): change one question, keep the others, then add a second Accordion"
tier: 1
user: neuron_editor
current_page: /neuron-test/block-types
rules: [B-T1-1, B-T1-2, B-T1-6, B-WRT-3]
known_to_fail_today: "P3.3-6: new. Before P3.3-6 the entries were invisible to get_block_data, and an update that left out accordionBlockData emptied the accordion (its save() deletes the entries and re-adds only what it is given)."
rubric: The accordion on /neuron-test/block-types has its second question changed to 'Can I renew by phone?', with its answer and the first entry unchanged; a second Accordion block with one entry, 'Where do I park?' answered 'Behind the library.', is added to Main. Both in an unpublished version; the published page is unchanged.
turns:
  - say: "In the accordion on this page, change the question 'Can I renew online?' to 'Can I renew by phone?' and keep its answer. Then add a new Accordion block to the Main area with one entry: the question 'Where do I park?' with the answer 'Behind the library.'"
    approval: approve
expect:
  state:
    blocks:
      - page: /neuron-test/block-types
        count: {type: accordion, equals: 2}
        has_block: {type: accordion, containing: ["How do I join?", "Ask at the front desk.", "Can I renew by phone?", "Yes, from your account page."]}
      - page: /neuron-test/block-types
        has_block: {type: accordion, containing: ["Where do I park?", "Behind the library."]}
    live_version_unchanged: /neuron-test/block-types
    changed_pages:
      exactly: [/neuron-test/block-types]
  reply:
    matches_all:
      - 'renew by phone'
      - '(draft|unpublished|not (yet )?(published|live)|awaiting|new version|(go(es)?|will (go|be)|becomes?|is) live (only )?(when|once|after|as soon as)[^.]{0,40}publish|(visible|shown|show) to (visitors|the public|everyone)[^.]{0,20}(when|once|after|as soon as|until)[^.]{0,40}publish|visitors (will )?(only )?see (it|this|the change|them)[^.]{0,20}(when|once|after|as soon as)[^.]{0,40}publish)'
