id: 19-page-context-navigation
title: "The user moves to another page mid-chat: answers and edits follow the new page"
tier: 1
user: neuron_editor
current_page: /neuron-test/headings
rules: [B-CTX-1, B-TRU-1, B-WRT-3]
rubric: Turn 1 names the Headings page. The user then navigates to Columns (the runner changes the page for turn 2, as the panel does when the user opens another page and sends a message). Turn 2 names Columns and does not name the old page's path. Turn 3 sets the meta title on Columns, in a new unpublished version, and Headings is untouched.
turns:
  - say: "What page am I on?"
    expect:
      tools:
        no_write_tool_succeeded: true
      reply:
        # B-CTX-1: the reply is the behaviour.
        matches_all:
          primary: true
          patterns:
            - 'Headings'
            - 'neuron-test/headings'
  - say: "What page am I on now?"
    current_page: /neuron-test/columns
    expect:
      tools:
        no_write_tool_succeeded: true
      reply:
        # B-CTX-1: the reply is the behaviour. It must name the new page and must not give the old page's path as the current one.
        matches_all:
          primary: true
          patterns:
            - 'Columns'
            - 'neuron-test/columns'
        not_matches:
          primary: true
          patterns:
            - 'neuron-test/headings'
  - say: "Set the meta title of this page to 'Columns Test Title'."
    current_page: /neuron-test/columns
    approval: approve
expect:
  state:
    # The edit goes to the page the user is on now, and not to the one they left.
    attribute: {page: /neuron-test/columns, handle: meta_title, equals: "Columns Test Title"}
    page_unchanged: /neuron-test/headings
    live_version_unchanged: /neuron-test/columns
    changed_pages:
      exactly: [/neuron-test/columns]
  reply:
    matches_all:
      - '(draft|unpublished|not (yet )?published|awaiting|new version)'
      - '(undo|revert|restore|previous version|version history)'
