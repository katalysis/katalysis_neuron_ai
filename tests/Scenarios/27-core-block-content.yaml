id: 27-core-block-content
title: "Core blocks (Content): add a sentence in place, then add a new Content block"
tier: 1
user: neuron_editor
current_page: /neuron-test/block-types
rules: [B-T1-1, B-T1-2, B-T1-6, B-WRT-3]
known_to_fail_today: "P3.3-6: new. The edit keeps the existing text in order, so it exercises P3.3-2's strict keep_text order check on a real request; a refusal of this ordinary edit is a finding for P3.3-6's PR."
rubric: The Content block on /neuron-test/block-types gets the sentence 'Bring your library card.' after the weekday opening sentence, with the rest of its text unchanged and in order, and a second Content block is added at the end of Main. Both changes are in an unpublished version; the published page is unchanged.
turns:
  - say: "In the Content block on this page, add the sentence 'Bring your library card.' straight after 'The library opens at nine on weekdays.' Then add a new Content block at the end of the Main area that says 'Opening times change in August.'"
    approval: approve
expect:
  state:
    blocks:
      - page: /neuron-test/block-types
        count: {type: content, equals: 2}
        has_block: {type: content, containing: ["Block Types Content", "The library opens at nine on weekdays.", "Bring your library card.", "story time is on Saturday mornings"]}
      - page: /neuron-test/block-types
        has_block: {type: content, containing: ["Opening times change in August."]}
    live_version_unchanged: /neuron-test/block-types
    changed_pages:
      exactly: [/neuron-test/block-types]
  reply:
    matches_all:
      - '(draft|unpublished|not (yet )?(published|live)|awaiting|new version|(go(es)?|will (go|be)|becomes?|is) live (only )?(when|once|after|as soon as)[^.]{0,40}publish|(visible|shown|show) to (visitors|the public|everyone)[^.]{0,20}(when|once|after|as soon as|until)[^.]{0,40}publish|visitors (will )?(only )?see (it|this|the change|them)[^.]{0,20}(when|once|after|as soon as)[^.]{0,40}publish)'
