id: 44-panel-dashboard-page
title: "Through the panel: what page am I on? On a dashboard page"
tier: any
user: superuser
current_page: /dashboard/sitemap
panel: {}
rules: [B-CTX-1, B-TRU-1, B-WRT-5]
known_to_fail_today: "P3.11-2: new."
rubric: Through the chat endpoint from a dashboard page (Sitemap), as an administrator. A dashboard page is a system page the assistant may read and use as the current page (B-WRT-5), and the page context resolves to it (BF-1). The assistant names the Sitemap page. No write.
turns:
  - say: "What page am I on?"
    expect:
      tools:
        # P3.12 (Glyn; as 22 in P3.7-2): get_current_page_context is no longer required. P3.7-2 dropped the prompt rule
        # that forced it, because the context block names the page; P3.S4's replies named it correctly in 3 of 3.
        no_write_tool_succeeded: true
      reply:
        # P3.12: naming the page is now the primary check.
        matches_any:
          primary: true
          patterns:
            - 'Sitemap'
expect:
  state:
    nothing_changed: true
