id: 43-panel-home-page
title: "Through the panel: what page am I on? On the home page"
tier: any
user: neuron_content_editor
current_page: /
panel: {}
rules: [B-CTX-1, B-TRU-1]
known_to_fail_today: "P3.11-2: new."
rubric: Scenario 22 through the chat endpoint with the panel's payload, whose location is "/" (the home page's stored path is empty, BF-1). The assistant names the home page, from the page context tool. No write.
turns:
  - say: "What page am I on?"
    expect:
      tools:
        # P3.12 (Glyn; as 22 in P3.7-2): get_current_page_context is no longer required. P3.7-2 dropped the prompt rule
        # that forced it, because the context block names the page; P3.S4's replies named it correctly in 3 of 3.
        no_write_tool_succeeded: true
      reply:
        # P3.12: naming the page is now the primary check.
        matches_any:
          primary: true
          patterns:
            - 'Home'
            - 'home page'
expect:
  state:
    nothing_changed: true
