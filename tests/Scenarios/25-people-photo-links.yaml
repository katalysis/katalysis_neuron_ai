id: 25-people-photo-links
title: "People with photo links"
tier: 1
user: neuron_content_editor
current_page: /neuron-test/people
rules: [B-TRU-1, B-TRU-9]
known_to_fail_today: "New in BF-12. Found in BF-11's browser check 4: katalysis_pro's list_people returned an image only as a site-relative path, and the reply gave https://your-domain/application/files/… links. Before BF-12 the reply may invent a host (fail) or give the path; after it the tools return an absolute imageUrl."
rubric: Lists the three test people. Test Person Alpha has a photo (the seed's "Neuron Test Person Photo"); the reply links it with the URL the people tools returned. Beta and Gamma have no photo, and the reply says so rather than making one up. A link uses only a host a tool returned, never a placeholder such as your-domain or example.com, and never a host added to a path.
turns:
  - say: "List the test people with a link to each one's photo."
    expect:
      tools:
        called_any: [list_people, get_person, get_person_details]
        no_write_tool_succeeded: true
      reply:
        # B-TRU-9: the rule is about what the assistant says, so primary.
        no_invented_hosts: {primary: true}
        # B-TRU-1: a read, so the reply is the only evidence the people were listed.
        matches_all:
          primary: true
          patterns:
            - 'Test Person Alpha'
            - 'Test Person Beta'
            - 'Test Person Gamma'
        # The link is the real one: the seed's photo file name (needs the BF-12 seed; SETUP, "Once per dev site").
        matches_any:
          - 'neuron-test-person'
expect:
  state:
    nothing_changed: true
