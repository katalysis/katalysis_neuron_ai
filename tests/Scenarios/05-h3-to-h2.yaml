id: 05-h3-to-h2
title: "Change all h3 headings to h2 on this page, body text unchanged"
tier: 1
user: neuron_editor
current_page: /neuron-test/headings
rules: [B-T1-2, B-T1-3, B-T1-1, B-WRT-3, B-CON-4, B-REP-1]
known_to_fail_today: "P1.5 baseline: fail (3 of 3 runs). The state checks fail too, not only the reply checks. The model calls batch_update_content_headings without headingTexts (explicit mode needs them), retries in bold_paragraph mode, which converts the wrong heading and leaves both h3 headings alone, or gives up. In 2 of 3 runs the approved version's blocks changed (P1.8). Spec B-REP-1 is also Not met."
rubric: Two headings change from h3 to h2 and nothing else. The change is in a new version, which is not published. The reply links the page, says it is not published, and says how to undo it. No confirmation question is needed, because there are only 2 headings on one page (the limit in B-CON-4 is 10).
turns:
  - say: "Change all the h3 headings on this page to h2. Don't change any of the body text."
    approval: approve
expect:
  state:
    blocks:
      - page: /neuron-test/headings
        headings:
          - {text: "Seed Heading Three A", level: 2}
          - {text: "Seed Heading Three B", level: 2}
        lacks_html: ["<h3"]
    all_text_unchanged: /neuron-test/headings
    live_version_unchanged: /neuron-test/headings
    changed_pages:
      exactly: [/neuron-test/headings]
  reply:
    matches_all:
      - 'neuron-test/headings'
      - '(draft|unpublished|not (yet )?published|awaiting|new version)'
      - '(undo|revert|restore|previous version|version history)'
