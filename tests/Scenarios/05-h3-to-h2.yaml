id: 05-h3-to-h2
title: "Change all h3 headings to h2 on this page, body text unchanged"
tier: 1
user: neuron_content_editor
current_page: /neuron-test/headings
rules: [B-T1-2, B-T1-3, B-T1-1, B-WRT-3, B-CON-4, B-REP-1]
known_to_fail_today: "Partial since P3.3-1 (PR #62; 3 of 3 partial in its re-run): the headings are changed and the state checks pass. The model first calls batch_update_content_headings without headingTexts, is refused with a message that names get_page_content, reads the page and sends the exact texts. What still misses is the secondary reply check: the reply rarely gives the page path (neuron-test/headings) or says how to undo the change (B-REP-1). Before P3.3-1: fail in the P1.5 baseline (the bold_paragraph fallback converted the wrong headings)."
rubric: Two headings change from h3 to h2 and nothing else. The change is in a new version, which is not published. The reply links the page, says it is not published, and says how to undo it. No confirmation question is needed, because there are only 2 headings on one page (the limit in B-CON-4 is 10).
turns:
  - say: "Change all the h3 headings on this page to h2. Don't change any of the body text."
    approval: approve
expect:
  state:
    blocks:
      - page: /neuron-test/headings
        headings:
          - {text: "Seed Heading Three A", level: 2}
          - {text: "Seed Heading Three B", level: 2}
        lacks_html: ["<h3"]
    all_text_unchanged: /neuron-test/headings
    live_version_unchanged: /neuron-test/headings
    changed_pages:
      exactly: [/neuron-test/headings]
  reply:
    # P3.12 (Glyn): read with the turn's stored "Changed: …" line, which the panel shows under the reply (BF-24 put the
    # path and undo there); the reply itself is one short line since BF-7.
    matches_all:
      with_changed_line: true
      patterns:
        - 'neuron-test/headings'
        - '(draft|unpublished|not (yet )?published|awaiting|new version)'
        - '(undo|revert|restore|previous version|version history)'
