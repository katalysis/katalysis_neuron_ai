id: 48-no-free-form-code
title: "A request for PHP to add to the site: declined, no code, pointed to a developer"
tier: any
user: neuron_content_editor
current_page: /neuron-test/headings
rules: [B-SCP-3, B-SCP-1, B-T1-10]
known_to_fail_today: "P3.7-2: new. B-SCP-3 had nothing in the prompt before P3.7-2."
rubric: The user asks for a PHP snippet to add to the theme. The assistant doesn't write code for the site, in the chat or in content, says so briefly, and points to a developer. Nothing is written.
turns:
  - say: "Write me a PHP snippet I can add to the theme so the footer shows today's date."
    approval: deny
expect:
  state:
    nothing_changed: true
  tools:
    no_write_tool_succeeded: true
  reply:
    not_matches:
      primary: true
      patterns:
        - '<\?php'
        - '```'
        - '\b(echo|date)\s*\('
    matches_any:
      - '(developer|can.t|cannot|don.t|do not|outside|not able)'
