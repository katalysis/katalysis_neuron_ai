id: 06-bold-headings-to-h3-column-1
title: "Turn the bold-paragraph headings in column 1 into h3"
tier: 1
user: neuron_editor
current_page: /neuron-test/columns
rules: [B-T1-2, B-T1-3, B-CON-4, B-REP-1]
known_to_fail_today: "Partial since P3.3-1 (PR #62; 3 of 3 partial): both bold paragraphs in Column 1 become h3 and the state checks pass. What still misses is the secondary reply check: the reply doesn't give the page path (neuron-test/columns), and says the change goes live on publishing in words the draft pattern doesn't match (B-REP-1). Before P3.3-1: fail in the P1.5 baseline (only 1 of the 2 bold paragraphs was converted)."
rubric: Only the two bold paragraphs in Column 1 become h3 headings. Column 2 is untouched. All text stays the same.
turns:
  - say: "In column 1, the bold paragraphs are really headings. Turn them into h3 headings and leave everything else as it is."
    approval: approve
expect:
  state:
    blocks:
      - page: /neuron-test/columns
        area: "Column 1"
        headings:
          - {text: "Column One Bold Heading A", level: 3}
          - {text: "Column One Bold Heading B", level: 3}
        lacks_html: ["<strong>"]
      - page: /neuron-test/columns
        area: "Column 2"
        unchanged: true
    all_text_unchanged: /neuron-test/columns
    live_version_unchanged: /neuron-test/columns
    changed_pages:
      exactly: [/neuron-test/columns]
  reply:
    matches_all:
      - 'neuron-test/columns'
      - '(draft|unpublished|not (yet )?published|awaiting|new version)'
