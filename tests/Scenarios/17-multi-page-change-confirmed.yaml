id: 17-multi-page-change-confirmed
title: "A change affecting several pages is confirmed first, then only those pages change"
tier: 1
user: neuron_content_editor
current_page: /neuron-test
rules: [B-CON-3, B-CON-5, B-T1-3, B-REP-1]
known_to_fail_today: "None known since P3.6-3: the approval cards are the confirmation. The model may set the attribute with a tool that changes the page description instead (two P3.6-2 runs used update_page); then attribute_on_children_of fails."
rubric: The request touches every direct child page of /neuron-test (not the page itself, and not the grandchild). The runner records those children when the fixture is set up, so this scenario doesn't depend on how many there are. Since P3.6-2 every write waits for approval, and the cards name each page, with the count above them (B-CON-3); they are the confirmation (Glyn, P3.6-3). Exactly those pages change after approval, and nothing else.
turns:
  - say: "Set the meta description to 'Neuron test page' on all the direct child pages of /neuron-test."
    approval: approve
    expect:
      tools:
        # B-CON-3: one card per child page, every child named, no other page; nothing written without approval.
        approvals_cover_children: /neuron-test
        no_write_without_approval: true
expect:
  state:
    attribute_on_children_of: {page: /neuron-test, handle: meta_description, equals: "Neuron test page"}
    changed_pages:
      exactly:
        - children_of: /neuron-test
    page_unchanged: /neuron-test
