id: 42-panel-ordinary-page
title: "Through the panel: set a meta title on an ordinary page, approved through the decide endpoint"
tier: 1
user: neuron_content_editor
current_page: /neuron-test/headings
panel: {}
rules: [B-CTX-1, B-WRT-1, B-WRT-3]
known_to_fail_today: "P3.11-2: new."
rubric: The turn goes through the chat endpoint with the panel's own payload (CCM_CID, location, title, URL), and the approval through the decide endpoint, as the browser sends them (P3.11-2; BF-1's bug, the panel sending no page ID, was invisible to the in-process runner). "This page" is /neuron-test/headings. The meta title is set in a draft after Approve, and the reply says it isn't live yet.
turns:
  - say: "Set the meta title of this page to 'Panel Path Title'."
    approval: approve
expect:
  state:
    attribute: {page: /neuron-test/headings, handle: meta_title, equals: "Panel Path Title"}
    live_version_unchanged: /neuron-test/headings
    changed_pages:
      exactly: [/neuron-test/headings]
  tools:
    approval_asked: [set_page_attribute_value]
    approval_decided: approve
    no_write_without_approval: true
  reply:
    matches_all:
      - '(draft|unpublished|not (yet )?(published|live)|new version|approv|publish)'
