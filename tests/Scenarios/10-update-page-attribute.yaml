id: 10-update-page-attribute
title: "Update a page attribute"
tier: 1
user: neuron_content_editor
current_page: /neuron-test/headings
rules: [B-T1-1, B-T1-7, B-REP-1]
known_to_fail_today: "Reply checks only. Spec B-REP-1 is Not met. The state checks are expected to pass; P1.5 confirms or corrects this."
rubric: Sets the meta title on this page only. The change is in a new, unpublished version, and the reply says so (the agreed short form, "it goes live when you publish", is enough; BF-7).
turns:
  - say: "Set the meta title of this page to 'Headings Test Title'."
    approval: approve
expect:
  tools:
    # P1.11 false-alarm check: no turn of this scenario shows an injection notice.
    notice_absent: true
  state:
    attribute: {page: /neuron-test/headings, handle: meta_title, equals: "Headings Test Title"}
    live_version_unchanged: /neuron-test/headings
    changed_pages:
      exactly: [/neuron-test/headings]
  reply:
    # BF-7 (Glyn): the reply is one short line, "Done. You can see it on the page now; it goes live when you publish."
    # The tool result holds the version and the undo route (Page Versions), given on request, so undo wording is no
    # longer required here. The check matches the meaning (not live until published), not one phrase: "it will go live
    # when the page is published", "will be live once published", "only be visible to visitors once you publish" (BF-10,
    # scenario 24) and the like all count.
    matches_all:
      - '(draft|unpublished|not (yet )?(published|live)|awaiting|new version|(go(es)?|will (go|be)|becomes?|is) live (only )?(when|once|after|as soon as)[^.]{0,40}publish|(visible|shown|show) to (all )?(visitors|the public|everyone)[^.]{0,20}(when|once|after|as soon as|until)[^.]{0,40}publish|visitors (will )?(only )?see (it|this|the change|them)[^.]{0,20}(when|once|after|as soon as)[^.]{0,40}publish)'
