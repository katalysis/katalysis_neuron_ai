id: 37-core-block-testimonial
title: "Core blocks (Testimonial): change the company, keep the quote, then add a second testimonial with the same photo"
tier: 1
user: neuron_content_editor
current_page: /neuron-test/block-types
rules: [B-T1-1, B-T1-2, B-T1-6, B-WRT-3]
known_to_fail_today: "P3.3-7: new, written with the Level 0 block adapter; not run before it."
rubric: The Testimonial on /neuron-test/block-types gets the company 'Harbourside Library Friends' and keeps its name and quote; a second Testimonial from 'Sam Reader', a Volunteer, saying 'I help with story time on Saturdays.' is added to Main with the same photo. Both in an unpublished version; the published page is unchanged.
turns:
  - say: "Change the company on the testimonial on this page to 'Harbourside Library Friends' and keep the quote as it is. Then add a new testimonial to the Main area from Sam Reader, a Volunteer, saying 'I help with story time on Saturdays.', with the same photo as the existing testimonial."
    approval: approve
expect:
  state:
    blocks:
      - page: /neuron-test/block-types
        count: {type: testimonial, equals: 2}
        has_block_field: {type: testimonial, field: company, equals: "Harbourside Library Friends"}
        has_block: {type: testimonial, containing: ["Pat Reader", "Harbourside Library Friends", "The library is the friendliest place in town."]}
      - page: /neuron-test/block-types
        has_block: {type: testimonial, containing: ["Sam Reader", "Volunteer", "I help with story time on Saturdays."]}
    live_version_unchanged: /neuron-test/block-types
    changed_pages:
      exactly: [/neuron-test/block-types]
  reply:
    matches_all:
      - 'Harbourside Library Friends'
      - '(draft|unpublished|not (yet )?(published|live)|awaiting|new version|(go(es)?|will (go|be)|becomes?|is) live (only )?(when|once|after|as soon as)[^.]{0,40}publish|(visible|shown|show) to (visitors|the public|everyone)[^.]{0,20}(when|once|after|as soon as|until)[^.]{0,40}publish|visitors (will )?(only )?see (it|this|the change|them)[^.]{0,20}(when|once|after|as soon as)[^.]{0,40}publish)'
