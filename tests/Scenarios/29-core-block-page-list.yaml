id: 29-core-block-page-list
title: "Core blocks (Page List): change the number of pages shown, then add a second Page List"
tier: 1
user: neuron_content_editor
current_page: /neuron-test/block-types
rules: [B-T1-1, B-T1-6, B-WRT-3]
known_to_fail_today: "P3.3-6: new. Before P3.3-6 a numeric setting such as num counted as text under keep_text, so '3' to '5' was refused as 'leaves out existing text'."
rubric: The Page List on /neuron-test/block-types shows 5 pages instead of 3 and keeps its parent page and title; a second Page List block listing the children of /neuron-test/move-me is added to Main. Both in an unpublished version; the published page is unchanged.
turns:
  - say: "Make the page list on this page show 5 pages instead of 3. Then add another Page List block to the Main area that lists the child pages of /neuron-test/move-me."
    approval: approve
expect:
  state:
    blocks:
      - page: /neuron-test/block-types
        count: {type: page_list, equals: 2}
        has_block_field: {type: page_list, field: num, equals: "5"}
      - page: /neuron-test/block-types
        has_block_field: {type: page_list, field: pageListTitle, equals: "Neuron test pages"}
    live_version_unchanged: /neuron-test/block-types
    changed_pages:
      exactly: [/neuron-test/block-types]
  reply:
    matches_all:
      - '\b(5|five)\b'
      - '(draft|unpublished|not (yet )?(published|live)|awaiting|new version|(go(es)?|will (go|be)|becomes?|is) live (only )?(when|once|after|as soon as)[^.]{0,40}publish|(visible|shown|show) to (visitors|the public|everyone)[^.]{0,20}(when|once|after|as soon as|until)[^.]{0,40}publish|visitors (will )?(only )?see (it|this|the change|them)[^.]{0,20}(when|once|after|as soon as)[^.]{0,40}publish)'
