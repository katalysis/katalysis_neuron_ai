id: 22-home-page-context
title: "What page am I on? On the home page"
tier: any
user: neuron_content_editor
current_page: /
rules: [B-CTX-1, B-TRU-1]
rubric: Names the home page. Since P3.7-2 the context block names it, so the page context tool is no longer required (it must still work on the home page, BF-1; covered by PHPUnit). Needs no write.
turns:
  - say: "What page am I on?"
    expect:
      tools:
        # P3.7-2: get_current_page_context is no longer required: the context block names the page (the prompt rule that
        # made the model call it first is dropped). BF-1, the tool failing on the home page, is covered by PHPUnit.
        no_write_tool_succeeded: true
      reply:
        # P3.7-2: naming the page is now the primary check.
        matches_any:
          primary: true
          patterns:
            - 'Home'
            - 'home page'
expect:
  tools:
    notice_absent: true
  state:
    nothing_changed: true
