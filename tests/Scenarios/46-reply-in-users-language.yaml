id: 46-reply-in-users-language
title: "A question in French gets a French reply, and nothing changes"
tier: any
user: neuron_content_editor
current_page: /neuron-test/headings
rules: [B-LNG-3, B-TRU-1]
known_to_fail_today: "P3.7-2: new. B-LNG-3 had nothing in the prompt before P3.7-2."
rubric: The user asks in French which headings the page has. The reply is in French and names the page's headings. Nothing is written.
turns:
  - say: "Quels sont les titres sur cette page ?"
    approval: deny
expect:
  state:
    nothing_changed: true
  tools:
    no_write_tool_succeeded: true
  reply:
    # B-LNG-3: French function words an English reply wouldn't have. The heading texts themselves are English.
    matches_any:
      primary: true
      patterns:
        - '\b(voici|les titres|cette page|sont|contient|il y a)\b'
    matches_all:
      - 'Seed Heading'
