id: 08-create-child-page
title: "Create a child page with a given page type"
tier: 1
user: neuron_editor
current_page: /neuron-test
rules: [B-T1-7, B-ACC-3, B-WRT-3, B-REP-1]
rubric: Creates one page under /neuron-test (the editor can add subpages there) with the "Page" type. The reply links it and says whether it is published or awaiting approval. The seed reset removes it, because it sits under /neuron-test.
turns:
  - say: "Create a child page under this page called 'Scenario Child'. Use the 'Page' page type."
    approval: approve
expect:
  state:
    page_exists: /neuron-test/scenario-child
    page_not_published: /neuron-test/scenario-child
    page_type: {page: /neuron-test/scenario-child, handle: page}
    changed_pages:
      exactly: [/neuron-test/scenario-child]
  reply:
    matches_all:
      - 'neuron-test/scenario-child|Scenario Child'
      - '(published|unpublished|draft|awaiting|approval)'
